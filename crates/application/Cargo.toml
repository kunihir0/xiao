[package]
name = "bot-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bot-domain = { version = "0.1.0", path = "../domain" }
login-session = { version = "0.1.0", path = "../login-session" }
rustix = { version = "1.1.5", features = ["fs", "process"] }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
bot-test-support = { path = "../test-support", version = "0.1.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
