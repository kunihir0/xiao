[package]
name = "rustplus-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
insecure-test-transport = []

[lints]
workspace = true

[dependencies]
bot-application = { version = "0.1.0", path = "../application" }
bot-domain = { version = "0.1.0", path = "../domain" }
bytes = "1.12.1"
push-receiver = { version = "0.1.0", path = "../push-receiver" }
reqwest.workspace = true
rustls.workspace = true
rustplus-client = { version = "0.1.0", path = "../rustplus-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures-util = "0.3.34"
proptest = "1.11.0"
rustplus-client = { path = "../rustplus-client", version = "0.1.0", features = ["insecure-test-transport"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
