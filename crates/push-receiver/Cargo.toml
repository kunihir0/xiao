[package]
name = "push-receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
bytes = "1.12.1"
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
