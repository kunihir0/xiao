[package]
name = "push-receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "rustls", "stream"] }
rustls = { version = "0.23.45", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = "0.26.6"
tokio-util = { workspace = true, features = ["codec"] }
url.workspace = true
webpki-roots = "1.0.9"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"
