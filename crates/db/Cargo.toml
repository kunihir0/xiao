[package]
name = "bot-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bot-application = { version = "0.1.0", path = "../application" }
bot-domain = { version = "0.1.0", path = "../domain" }
tokio = { version = "1.53.2", features = ["sync"] }
deadpool = { version = "0.13.1", features = ["rt_tokio_1"] }
diesel = { version = "2.3.13", features = ["postgres", "uuid"] }
diesel-async = { version = "0.9.2", features = ["postgres", "migrations", "deadpool"] }
diesel_migrations = "2.3.2"
aes-gcm-siv.workspace = true
rand.workspace = true
uuid.workspace = true
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }
