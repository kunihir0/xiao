[workspace]
members = [
  "apps/bot",
  "crates/application",
  "crates/config",
  "crates/db",
  "crates/discord",
  "crates/domain",
  "crates/push-receiver",
  "crates/rustplus-adapter",
  "crates/rustplus-client",
  "crates/telemetry",
  "crates/test-support",
  "crates/phase0-evidence",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
[workspace.dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
poise = "0.7.0"
thiserror = "2.0.21"
tracing = "0.1.41"
aes-gcm-siv = { version = "0.12.1", features = ["zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }
rand = "0.10.3"
uuid = { version = "1.27.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
