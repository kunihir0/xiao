[workspace]
members = [
  "apps/bot",
  "crates/application",
  "crates/config",
  "crates/db",
  "crates/discord",
  "crates/domain",
  "crates/push-receiver",
  "crates/rustplus-adapter",
  "crates/rustplus-client",
  "crates/telemetry",
  "crates/test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
[workspace.dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"


[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
