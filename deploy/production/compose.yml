# Production application only. PostgreSQL is provisioned and backed up separately.
# Set XIAO_IMAGE to an immutable registry reference, never :latest.
secrets:
  discord_token:
    file: "${DISCORD_TOKEN_FILE:?set DISCORD_TOKEN_FILE to a secret-manager-mounted file}"
  database_url:
    file: "${DATABASE_URL_FILE:?set DATABASE_URL_FILE to a secret-manager-mounted file}"
  migration_database_url:
    file: "${MIGRATION_DATABASE_URL_FILE:-/dev/null}"
  database_ca:
    file: "${DATABASE_CA_FILE:-/dev/null}"
  rustplus_fcm_sender_id:
    # /dev/null means disabled until #16 credential persistence is deployed.
    file: "${RUSTPLUS_FCM_SENDER_ID_FILE:-/dev/null}"
services:
  bot:
    image: "${XIAO_IMAGE:?set XIAO_IMAGE to an immutable image digest}"
    init: true
    restart: "on-failure:5"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/usr/local/bin/xiao-entrypoint"]
    environment:
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      DATABASE_CA_FILE: "${DATABASE_CA_FILE:-/run/secrets/database_ca}"
      DATABASE_TLS_MODE: "${DATABASE_TLS_MODE:-verify-full}"
      DATABASE_MIGRATE_ON_STARTUP: "${DATABASE_MIGRATE_ON_STARTUP:-false}"
      RUSTPLUS_FCM_SENDER_ID_FILE: /run/secrets/rustplus_fcm_sender_id
      RUST_LOG: "${RUST_LOG:-info}"
      TELEMETRY_FORMAT: "${TELEMETRY_FORMAT:-json}"
    secrets:
      - source: discord_token
        target: discord_token
        mode: 0444
      - source: database_url
        target: database_url
        mode: 0444
      - source: migration_database_url
        target: migration_database_url
        mode: 0444
      - source: database_ca
        target: database_ca
        mode: 0444
      - source: rustplus_fcm_sender_id
        target: rustplus_fcm_sender_id
        mode: 0444
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      # There is deliberately no HTTP health server. PID 1 is healthy while alive;
      # migration/readiness failures make the process exit and trigger finite retries.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
