name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        shell: bash
        run: echo "channel=$(awk -F '\"' '/^channel/ {print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        shell: bash
        run: echo "channel=$(awk -F '\"' '/^channel/ {print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        shell: bash
        run: echo "channel=$(awk -F '\"' '/^channel/ {print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
          fallback: none
      - run: cargo nextest run --workspace --all-features --no-tests=pass

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        shell: bash
        run: echo "channel=$(awk -F '\"' '/^channel/ {print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
          fallback: none
      - run: cargo deny check

  shear:
    name: shear
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        shell: bash
        run: echo "channel=$(awk -F '\"' '/^channel/ {print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-shear
      - run: cargo shear

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: bot_test
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d bot_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://bot:bot@127.0.0.1:5432/bot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        shell: bash
        run: echo "channel=$(awk -F '\"' '/^channel/ {print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
          fallback: none
      - name: Generate ephemeral TLS certificates for PostgreSQL TLS integration test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pg-tls
          # Root CA
          openssl req -new -x509 -days 1 -nodes \
            -subj "/CN=Test PostgreSQL Root CA" \
            -keyout /tmp/pg-tls/ca.key -out /tmp/pg-tls/ca.crt
          # Server certificate for localhost
          openssl req -new -nodes \
            -subj "/CN=localhost" \
            -keyout /tmp/pg-tls/server.key -out /tmp/pg-tls/server.csr
          openssl x509 -req -days 1 -in /tmp/pg-tls/server.csr \
            -CA /tmp/pg-tls/ca.crt -CAkey /tmp/pg-tls/ca.key -CAcreateserial \
            -out /tmp/pg-tls/server.crt \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1")
          # Wrong CA
          openssl req -new -x509 -days 1 -nodes \
            -subj "/CN=Untrusted Root CA" \
            -keyout /tmp/pg-tls/wrong_ca.key -out /tmp/pg-tls/wrong_ca.crt
          # Ensure container user (UID 70 postgres in alpine) can read the key and cert
          chmod 0644 /tmp/pg-tls/server.key /tmp/pg-tls/ca.key /tmp/pg-tls/server.crt /tmp/pg-tls/ca.crt /tmp/pg-tls/wrong_ca.crt
      - name: Start PostgreSQL container with TLS enabled
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name postgres-tls \
            -e POSTGRES_DB=bot_tls \
            -e POSTGRES_USER=bot \
            -e POSTGRES_PASSWORD=bot \
            -p 5433:5432 \
            -v /tmp/pg-tls/server.crt:/var/lib/postgresql/server.crt:ro \
            -v /tmp/pg-tls/server.key:/var/lib/postgresql/server.key:ro \
            postgres:18.6-alpine \
            -c ssl=on \
            -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key
          for _ in {1..30}; do
            if docker exec postgres-tls pg_isready -U bot -d bot_tls >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - name: Run database tests including TLS verify-full tests
        env:
          DATABASE_TLS_URL: postgres://bot:bot@localhost:5433/bot_tls
          DATABASE_TLS_HOSTNAME_MISMATCH_URL: postgres://bot:bot@127.0.0.2:5433/bot_tls
          DATABASE_CA_FILE: /tmp/pg-tls/ca.crt
          DATABASE_WRONG_CA_FILE: /tmp/pg-tls/wrong_ca.crt
        run: cargo nextest run -p bot-db --all-features --run-ignored all
