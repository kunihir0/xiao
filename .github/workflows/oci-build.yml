name: oci-build

on:
  pull_request:
    paths:
      - ".github/workflows/oci-build.yml"
      - "deploy/production/**"
      - "scripts/validate-production-env.sh"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to label the build (e.g. v0.2.0 or test)"
        required: false
        default: "test"
        type: string

permissions:
  contents: read

concurrency:
  group: oci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: oci ${{ matrix.arch }} build check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build native OCI image without push
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --file deploy/production/Dockerfile \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label 'org.opencontainers.image.source=https://github.com/kunihir0/xiao' \
            --cache-from "type=gha,scope=xiao-oci-${{ matrix.arch }}" \
            --cache-to "type=gha,mode=max,scope=xiao-oci-${{ matrix.arch }}" \
            --output "type=oci,dest=xiao-${{ matrix.arch }}.tar" \
            .
      - name: Inspect image metadata and record digest
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tar -xOf "xiao-${EXPECTED_ARCH}.tar" index.json > oci-index.json
          read -r platform digest < <(
            jq -r --arg arch "$EXPECTED_ARCH" '.manifests[]
              | select(.platform.os == "linux" and .platform.architecture == $arch)
              | [.platform.os + "/" + .platform.architecture, .digest]
              | @tsv' oci-index.json
          )
          test "$platform" = "linux/$EXPECTED_ARCH"
          hash=${digest#sha256:}
          manifest=$(tar -xOf "xiao-${EXPECTED_ARCH}.tar" "blobs/sha256/$hash")
          config_digest=$(jq -r '.config.digest' <<<"$manifest")
          config_hash=${config_digest#sha256:}
          config=$(tar -xOf "xiao-${EXPECTED_ARCH}.tar" "blobs/sha256/$config_hash")
          revision=$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<<"$config")
          test "$revision" = "$EXPECTED_REVISION"
          printf '%s manifest=%s config=%s revision=%s\n' \
            "$platform" "$digest" "$config_digest" "$revision" > "oci-${EXPECTED_ARCH}.txt"
          cat "oci-${EXPECTED_ARCH}.txt"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: oci-metadata-${{ matrix.arch }}-${{ github.sha }}
          path: oci-${{ matrix.arch }}.txt
          if-no-files-found: error

  metadata:
    name: multiarch OCI metadata
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: oci-metadata-*-${{ github.sha }}
          path: metadata
          merge-multiple: true
      - name: Verify both platform digests
        run: |
          set -euo pipefail
          cat metadata/oci-amd64.txt metadata/oci-arm64.txt > oci-metadata.txt
          test "$(grep -c '^linux/amd64 ' oci-metadata.txt)" -eq 1
          test "$(grep -c '^linux/arm64 ' oci-metadata.txt)" -eq 1
          test "$(grep -Fc 'revision=${{ github.sha }}' oci-metadata.txt)" -eq 2
          cat oci-metadata.txt
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: oci-metadata-${{ github.sha }}
          path: oci-metadata.txt
          if-no-files-found: error
