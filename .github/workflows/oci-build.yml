name: oci-build

on:
  pull_request:
    paths:
      - ".github/workflows/oci-build.yml"
      - "deploy/production/**"
      - "scripts/validate-production-env.sh"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to label the build (e.g. v0.2.0 or test)"
        required: false
        default: "test"
        type: string

permissions:
  contents: read

concurrency:
  group: oci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: multiarch oci build check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build multiarch OCI image without push
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deploy/production/Dockerfile \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label 'org.opencontainers.image.source=https://github.com/kunihir0/xiao' \
            --cache-from type=gha,scope=xiao-oci \
            --cache-to type=gha,mode=max,scope=xiao-oci \
            --output type=oci,dest=xiao-oci.tar \
            .
      - name: Inspect image metadata and record digests
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          tar -tf xiao-oci.tar
          tar -xOf xiao-oci.tar index.json | jq . > oci-index.json
          : > oci-metadata.txt
          count=0
          while IFS=$'\t' read -r platform digest; do
            hash=${digest#sha256:}
            manifest=$(tar -xOf xiao-oci.tar "blobs/sha256/$hash")
            config_digest=$(jq -r '.config.digest' <<<"$manifest")
            config_hash=${config_digest#sha256:}
            config=$(tar -xOf xiao-oci.tar "blobs/sha256/$config_hash")
            revision=$(jq -r '.config.Labels[\"org.opencontainers.image.revision\"] // empty' <<<"$config")
            test "$revision" = "$EXPECTED_REVISION"
            printf '%s manifest=%s config=%s revision=%s\n' \
              "$platform" "$digest" "$config_digest" "$revision" | tee -a oci-metadata.txt
            count=$((count + 1))
          done < <(
            jq -r '.manifests[]
              | select(.platform.os == \"linux\")
              | select(.platform.architecture == \"amd64\" or .platform.architecture == \"arm64\")
              | [.platform.os + \"/\" + .platform.architecture, .digest]
              | @tsv' oci-index.json
          )
          test "$count" -eq 2
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: oci-metadata-${{ github.sha }}
          path: |
            oci-index.json
            oci-metadata.txt
          if-no-files-found: error
